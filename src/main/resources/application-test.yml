# Test Profile Configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # Create schema before test, drop after
    show-sql: true
  
  h2:
    console:
      enabled: true

logging:
  level:
    root: INFO
    com.mealorder: DEBUG
